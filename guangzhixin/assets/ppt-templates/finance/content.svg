<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="财务分析第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f2f7f5" /><text x="80" y="92" font-size="18" fill="#218979" font-weight="500" letter-spacing="3">02 / FINANCIAL INSIGHTS</text><text x="80" y="185" font-size="52" fill="#123e42" font-weight="600" >让财务数据成为经营决策的依据</text><text x="80" y="238" font-size="22" fill="#63817f" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#dfede7" /><text x="112" y="405" font-size="54" fill="#218979" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#123e42" font-weight="600" >关注收入结构变化</text><text x="112" y="560" font-size="21" fill="#63817f" font-weight="400" >追踪关键业务贡献，识别可持续增</text><text x="112" y="598" font-size="21" fill="#63817f" font-weight="400" >长来源。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#218979" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#dfede7" /><text x="600" y="405" font-size="54" fill="#218979" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#123e42" font-weight="600" >提升成本管理效率</text><text x="600" y="560" font-size="21" fill="#63817f" font-weight="400" >分析资源投入产出，推动精细化运</text><text x="600" y="598" font-size="21" fill="#63817f" font-weight="400" >营。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#218979" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#dfede7" /><text x="1088" y="405" font-size="54" fill="#218979" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#123e42" font-weight="600" >强化现金流韧性</text><text x="1088" y="560" font-size="21" fill="#63817f" font-weight="400" >平衡短期经营需求与长期价值创造</text><text x="1088" y="598" font-size="21" fill="#63817f" font-weight="400" >。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#218979" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#63817f" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#63817f" font-weight="400" >财务分析 / FINANCIAL INSIGHTS</text><text x="1520" y="850" font-size="18" fill="#63817f" font-weight="500" text-anchor="end">03</text></g></svg>
