<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="课程讲义第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#294c40" /><text x="80" y="92" font-size="18" fill="#c2d38b" font-weight="500" letter-spacing="3">02 / LEARNING &amp; DEVELOPMENT</text><text x="80" y="185" font-size="52" fill="#f8f6e9" font-weight="600" >从理解到实践，构建可迁移的能力</text><text x="80" y="238" font-size="22" fill="#b4c7b0" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#3d6150" /><text x="112" y="405" font-size="54" fill="#c2d38b" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#f8f6e9" font-weight="600" >建立系统认知框架</text><text x="112" y="560" font-size="21" fill="#b4c7b0" font-weight="400" >连接新知识与已有经验，理解核心</text><text x="112" y="598" font-size="21" fill="#b4c7b0" font-weight="400" >概念。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#c2d38b" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#3d6150" /><text x="600" y="405" font-size="54" fill="#c2d38b" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#f8f6e9" font-weight="600" >通过真实场景练习</text><text x="600" y="560" font-size="21" fill="#b4c7b0" font-weight="400" >围绕工作中的具体问题，练习关键</text><text x="600" y="598" font-size="21" fill="#b4c7b0" font-weight="400" >方法。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#c2d38b" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#3d6150" /><text x="1088" y="405" font-size="54" fill="#c2d38b" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#f8f6e9" font-weight="600" >形成个人行动清单</text><text x="1088" y="560" font-size="21" fill="#b4c7b0" font-weight="400" >把课堂收获转化为可执行的日常行</text><text x="1088" y="598" font-size="21" fill="#b4c7b0" font-weight="400" >动。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#c2d38b" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#b4c7b0" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#b4c7b0" font-weight="400" >课程讲义 / LEARNING &amp; DEVELOPMENT</text><text x="1520" y="850" font-size="18" fill="#b4c7b0" font-weight="500" text-anchor="end">03</text></g></svg>
