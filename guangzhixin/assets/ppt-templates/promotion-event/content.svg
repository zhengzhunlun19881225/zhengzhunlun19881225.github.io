<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="活动推广第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#49375f" /><text x="80" y="92" font-size="18" fill="#e7a8bc" font-weight="500" letter-spacing="3">02 / BRAND STORIES</text><text x="80" y="185" font-size="52" fill="#fbf0f3" font-weight="600" >用一致而鲜明的表达建立品牌认知</text><text x="80" y="238" font-size="22" fill="#c5b5d6" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#604874" /><text x="112" y="405" font-size="54" fill="#e7a8bc" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#fbf0f3" font-weight="600" >讲述有温度的故事</text><text x="112" y="560" font-size="21" fill="#c5b5d6" font-weight="400" >从真实体验出发，传递品牌的长期</text><text x="112" y="598" font-size="21" fill="#c5b5d6" font-weight="400" >价值。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#e7a8bc" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#604874" /><text x="600" y="405" font-size="54" fill="#e7a8bc" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#fbf0f3" font-weight="600" >构建有辨识度的表达</text><text x="600" y="560" font-size="21" fill="#c5b5d6" font-weight="400" >让视觉与内容围绕统一的品牌主张</text><text x="600" y="598" font-size="21" fill="#c5b5d6" font-weight="400" >展开。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#e7a8bc" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#604874" /><text x="1088" y="405" font-size="54" fill="#e7a8bc" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#fbf0f3" font-weight="600" >连接有共鸣的人群</text><text x="1088" y="560" font-size="21" fill="#c5b5d6" font-weight="400" >选择合适的触点，让内容走进目标</text><text x="1088" y="598" font-size="21" fill="#c5b5d6" font-weight="400" >人群。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#e7a8bc" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#c5b5d6" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#c5b5d6" font-weight="400" >活动推广 / BRAND STORIES</text><text x="1520" y="850" font-size="18" fill="#c5b5d6" font-weight="500" text-anchor="end">03</text></g></svg>
