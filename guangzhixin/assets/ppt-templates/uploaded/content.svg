<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="自定义模板第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#eaf0f6" /><text x="80" y="92" font-size="18" fill="#5079a7" font-weight="500" letter-spacing="3">02 / YOUR PRESENTATION</text><text x="80" y="185" font-size="52" fill="#273e59" font-weight="600" >以清晰的结构呈现你的核心观点</text><text x="80" y="238" font-size="22" fill="#71839b" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#dbe5ef" /><text x="112" y="405" font-size="54" fill="#5079a7" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#273e59" font-weight="600" >明确内容主题</text><text x="112" y="560" font-size="21" fill="#71839b" font-weight="400" >围绕目标与受众，建立清晰的表达</text><text x="112" y="598" font-size="21" fill="#71839b" font-weight="400" >主线。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#5079a7" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#dbe5ef" /><text x="600" y="405" font-size="54" fill="#5079a7" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#273e59" font-weight="600" >梳理重点信息</text><text x="600" y="560" font-size="21" fill="#71839b" font-weight="400" >通过有层次的组织，让核心信息更</text><text x="600" y="598" font-size="21" fill="#71839b" font-weight="400" >突出。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#5079a7" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#dbe5ef" /><text x="1088" y="405" font-size="54" fill="#5079a7" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#273e59" font-weight="600" >形成行动方向</text><text x="1088" y="560" font-size="21" fill="#71839b" font-weight="400" >把观点连接到具体任务与后续行动</text><text x="1088" y="598" font-size="21" fill="#71839b" font-weight="400" >。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#5079a7" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#71839b" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#71839b" font-weight="400" >自定义模板 / YOUR PRESENTATION</text><text x="1520" y="850" font-size="18" fill="#71839b" font-weight="500" text-anchor="end">03</text></g></svg>
