<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="极简商务第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f5f6f7" /><text x="80" y="92" font-size="18" fill="#5277a2" font-weight="500" letter-spacing="3">02 / BUSINESS STRATEGY</text><text x="80" y="185" font-size="52" fill="#293d58" font-weight="600" >将业务目标转化为清晰的行动路径</text><text x="80" y="238" font-size="22" fill="#788799" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#e5ebf2" /><text x="112" y="405" font-size="54" fill="#5277a2" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#293d58" font-weight="600" >统一目标与判断标准</text><text x="112" y="560" font-size="21" fill="#788799" font-weight="400" >围绕共同目标，形成可衡量的价值</text><text x="112" y="598" font-size="21" fill="#788799" font-weight="400" >共识。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#5277a2" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#e5ebf2" /><text x="600" y="405" font-size="54" fill="#5277a2" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#293d58" font-weight="600" >聚焦关键业务突破</text><text x="600" y="560" font-size="21" fill="#788799" font-weight="400" >连接核心场景，把资源投入关键任</text><text x="600" y="598" font-size="21" fill="#788799" font-weight="400" >务。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#5277a2" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#e5ebf2" /><text x="1088" y="405" font-size="54" fill="#5277a2" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#293d58" font-weight="600" >建立协同推进机制</text><text x="1088" y="560" font-size="21" fill="#788799" font-weight="400" >以阶段复盘推动团队持续优化与迭</text><text x="1088" y="598" font-size="21" fill="#788799" font-weight="400" >代。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#5277a2" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#788799" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#788799" font-weight="400" >极简商务 / BUSINESS STRATEGY</text><text x="1520" y="850" font-size="18" fill="#788799" font-weight="500" text-anchor="end">03</text></g></svg>
