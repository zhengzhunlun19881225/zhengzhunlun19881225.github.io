<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="组织变革第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#423746" /><text x="80" y="92" font-size="18" fill="#d5b481" font-weight="500" letter-spacing="3">02 / STRATEGY &amp; TRANSFORMATION</text><text x="80" y="185" font-size="52" fill="#f6eee9" font-weight="600" >将长期愿景转化为可执行的战略选择</text><text x="80" y="238" font-size="22" fill="#c6b6c4" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#57485a" /><text x="112" y="405" font-size="54" fill="#d5b481" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#f6eee9" font-weight="600" >识别结构性机会</text><text x="112" y="560" font-size="21" fill="#c6b6c4" font-weight="400" >结合市场趋势与自身条件，识别增</text><text x="112" y="598" font-size="21" fill="#c6b6c4" font-weight="400" >长空间。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#d5b481" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#57485a" /><text x="600" y="405" font-size="54" fill="#d5b481" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#f6eee9" font-weight="600" >建立差异化优势</text><text x="600" y="560" font-size="21" fill="#c6b6c4" font-weight="400" >围绕关键能力构建可持续的竞争优</text><text x="600" y="598" font-size="21" fill="#c6b6c4" font-weight="400" >势。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#d5b481" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#57485a" /><text x="1088" y="405" font-size="54" fill="#d5b481" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#f6eee9" font-weight="600" >形成分阶段路线</text><text x="1088" y="560" font-size="21" fill="#c6b6c4" font-weight="400" >将战略方向分解为清晰的任务与里</text><text x="1088" y="598" font-size="21" fill="#c6b6c4" font-weight="400" >程碑。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#d5b481" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#c6b6c4" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#c6b6c4" font-weight="400" >组织变革 / STRATEGY &amp; TRANSFORMATION</text><text x="1520" y="850" font-size="18" fill="#c6b6c4" font-weight="500" text-anchor="end">03</text></g></svg>
