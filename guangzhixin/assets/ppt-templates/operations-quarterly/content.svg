<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="季度复盘第3页"><g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#faf3e9" /><text x="80" y="92" font-size="18" fill="#bb7848" font-weight="500" letter-spacing="3">02 / ANNUAL OPERATIONS REPORT</text><text x="80" y="185" font-size="52" fill="#553a2c" font-weight="600" >以稳健经营构建长期增长基础</text><text x="80" y="238" font-size="22" fill="#917869" font-weight="400" >核心观点 / 重点分析</text><rect x="80" y="320" width="460" height="390" rx="16" fill="#f0e4d3" /><text x="112" y="405" font-size="54" fill="#bb7848" font-weight="500" >01</text><text x="112" y="495" font-size="28" fill="#553a2c" font-weight="600" >经营质量持续提升</text><text x="112" y="560" font-size="21" fill="#917869" font-weight="400" >从规模增长走向质量与效率的双重</text><text x="112" y="598" font-size="21" fill="#917869" font-weight="400" >提升。</text><line x1="112" y1="656" x2="206" y2="656" stroke="#bb7848" stroke-width="3"/><rect x="568" y="320" width="460" height="390" rx="16" fill="#f0e4d3" /><text x="600" y="405" font-size="54" fill="#bb7848" font-weight="500" >02</text><text x="600" y="495" font-size="28" fill="#553a2c" font-weight="600" >重点项目稳步推进</text><text x="600" y="560" font-size="21" fill="#917869" font-weight="400" >紧扣年度目标，推进重点任务闭环</text><text x="600" y="598" font-size="21" fill="#917869" font-weight="400" >落实。</text><line x1="600" y1="656" x2="694" y2="656" stroke="#bb7848" stroke-width="3"/><rect x="1056" y="320" width="460" height="390" rx="16" fill="#f0e4d3" /><text x="1088" y="405" font-size="54" fill="#bb7848" font-weight="500" >03</text><text x="1088" y="495" font-size="28" fill="#553a2c" font-weight="600" >组织效能协同改善</text><text x="1088" y="560" font-size="21" fill="#917869" font-weight="400" >完善跨部门协作，释放组织内生动</text><text x="1088" y="598" font-size="21" fill="#917869" font-weight="400" >力。</text><line x1="1088" y1="656" x2="1182" y2="656" stroke="#bb7848" stroke-width="3"/><line x1="80" y1="806" x2="1520" y2="806" stroke="#917869" stroke-opacity="0.35"/><text x="80" y="850" font-size="18" fill="#917869" font-weight="400" >季度复盘 / ANNUAL OPERATIONS REPORT</text><text x="1520" y="850" font-size="18" fill="#917869" font-weight="500" text-anchor="end">03</text></g></svg>
